name: Update Roblox player peaks

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-peaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Poll Roblox player counts
        run: node scripts/update-roblox.mjs

      - name: Commit updated peaks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roblox.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Roblox player peaks [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

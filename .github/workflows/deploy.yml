name: Deploy live resume

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (primary site)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (main)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Apply TryHackMe vars
        env:
          THM_USERNAME: ${{ vars.THM_USERNAME }}
          THM_USER_PUBLIC_ID: ${{ vars.THM_USER_PUBLIC_ID }}
          THM_USER_HASH: ${{ vars.THM_USER_HASH }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'config/profile.json';
          const profile = JSON.parse(fs.readFileSync(p, 'utf8'));
          profile.tryhackme = profile.tryhackme || {};
          if (process.env.THM_USERNAME) profile.tryhackme.username = process.env.THM_USERNAME;
          if (process.env.THM_USER_PUBLIC_ID) profile.tryhackme.userPublicId = process.env.THM_USER_PUBLIC_ID;
          if (process.env.THM_USER_HASH) profile.tryhackme.userHash = process.env.THM_USER_HASH;
          fs.writeFileSync(p, JSON.stringify(profile, null, 2) + '\n');
          NODE

      - name: Refresh TryHackMe data
        run: |
          npm run update:playwright || npm run update

      - name: Commit refreshed data on main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thm.json assets/rooms public/rooms
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh TryHackMe data"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "push skipped (race); build still uses refreshed data"
          fi

      - name: Build primary site (/resume)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_BASE_PATH: /resume

      - name: Build Frutiger variant (/resume/frutiger)
        run: |
          set -euo pipefail
          git fetch origin frutiger
          git worktree add /tmp/resume-frutiger origin/frutiger
          cd /tmp/resume-frutiger
          npm ci
          # Reuse freshly synced THM data + room images from the main workspace
          mkdir -p data public
          cp -f "$GITHUB_WORKSPACE/data/thm.json" data/thm.json
          if [ -d "$GITHUB_WORKSPACE/public/rooms" ]; then
            rm -rf public/rooms
            cp -a "$GITHUB_WORKSPACE/public/rooms" public/rooms
          fi
          if [ -d "$GITHUB_WORKSPACE/assets/rooms" ]; then
            mkdir -p assets
            rm -rf assets/rooms
            cp -a "$GITHUB_WORKSPACE/assets/rooms" assets/rooms
          fi
          NODE_ENV=production NEXT_BASE_PATH=/resume/frutiger npm run build
          mkdir -p "$GITHUB_WORKSPACE/out/frutiger"
          cp -a out/. "$GITHUB_WORKSPACE/out/frutiger/"
          # Nested Pages path needs an index at /resume/frutiger/
          test -f "$GITHUB_WORKSPACE/out/frutiger/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

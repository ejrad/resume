name: Deploy live resume

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Apply TryHackMe vars
        env:
          THM_USERNAME: ${{ vars.THM_USERNAME }}
          THM_USER_PUBLIC_ID: ${{ vars.THM_USER_PUBLIC_ID }}
          THM_USER_HASH: ${{ vars.THM_USER_HASH }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'config/profile.json';
          const profile = JSON.parse(fs.readFileSync(p, 'utf8'));
          profile.tryhackme = profile.tryhackme || {};
          if (process.env.THM_USERNAME) profile.tryhackme.username = process.env.THM_USERNAME;
          if (process.env.THM_USER_PUBLIC_ID) profile.tryhackme.userPublicId = process.env.THM_USER_PUBLIC_ID;
          if (process.env.THM_USER_HASH) profile.tryhackme.userHash = process.env.THM_USER_HASH;
          fs.writeFileSync(p, JSON.stringify(profile, null, 2) + '\n');
          NODE

      - name: Refresh TryHackMe data
        run: |
          npm run update:playwright || npm run update

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thm.json assets/rooms public/rooms
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh TryHackMe data"
            git push
          fi

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Resume Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --text: #e6edf3;
        --muted: #8aa0b5;
        --accent: #88cc14;
        --line: #243044;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
        background:
          radial-gradient(900px 500px at 10% -10%, #1ba94c33, transparent 60%),
          radial-gradient(700px 400px at 90% 0%, #58a6ff22, transparent 55%),
          var(--bg);
      }
      header {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 8px;
      }
      header h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        font-family: "IBM Plex Mono", monospace;
      }
      header p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      main {
        max-width: 920px;
        margin: 16px auto 48px;
        padding: 28px 24px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 20px 60px #00000055;
      }
      .markdown-body { line-height: 1.55; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
      .markdown-body a { color: #58a6ff; }
      .markdown-body img { max-width: 100%; background: #0d1117; border-radius: 8px; }
      .markdown-body table { border-collapse: collapse; width: 100%; }
      .markdown-body th, .markdown-body td { border: 1px solid var(--line); padding: 10px; vertical-align: top; }
      .markdown-body code, .markdown-body kbd {
        font-family: "IBM Plex Mono", monospace;
        background: #0d1117;
        padding: 0.1em 0.35em;
        border-radius: 6px;
      }
      .error { color: #ff7b72; }
    </style>
  </head>
  <body>
    <header>
      <h1>Realtime Resume Preview</h1>
      <p>Rendered from <code>README.md</code> · edit <code>config/profile.json</code> then <code>npm run update</code></p>
    </header>
    <main>
      <article id="content" class="markdown-body">Loading…</article>
    </main>
    <script>
      async function boot() {
        const el = document.getElementById("content");
        try {
          const res = await fetch("../README.md?ts=" + Date.now());
          if (!res.ok) throw new Error("HTTP " + res.status);
          const md = await res.text();
          el.innerHTML = marked.parse(md);
        } catch (e) {
          el.innerHTML = '<p class="error">Could not load README.md (' + e.message + '). Run preview from the repo root.</p>';
        }
      }
      boot();
    </script>
  </body>
</html>
